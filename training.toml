# training.toml — 5-kitty training world (heterogeneity + scarcity + 1.5x tempo)
# The gym, not the bar: kitty-eval always scores on the default 32x32 world.
# This is the probe-searched "scarcity1-rates150" world (frozen 2026-07-27):
# needs_driven holds team welfare ~0.88 here (bounds pass with margin).

[world]
width = 24
height = 24
tick_ms = 800        # never consulted headlessly (budgetless dispatch)
seed = 1             # base seed; per-episode seeds come from reset()/VectorEnv

[[kitty]]
id = 1
name = "Miso"
x = 4
y = 4
behavior = "needs_driven"   # placeholder — control is per-episode, not config

[[kitty]]
id = 2
name = "Biscuit"
x = 19
y = 4
behavior = "needs_driven"
# A player: play pressure returns fast.
[kitty.needs]
play = 0.7

[[kitty]]
id = 3
name = "Pumpkin"
x = 4
y = 19
behavior = "needs_driven"
# The canon snacky cat, kept snacky in training.
[kitty.needs]
eat = 0.8

[[kitty]]
id = 4
name = "Kittybear"
x = 19
y = 19
behavior = "needs_driven"
# A big sleepy cat: sunbeams matter to Kittybear.
[kitty.needs]
sleep = 0.5

[[kitty]]
id = 5
name = "Clementine"
x = 12
y = 12
behavior = "needs_driven"
# Affection-hungry: with an odd roster and pairwise cuddles, someone is
# always left out — Clementine makes turn-taking a live decision.
[kitty.needs]
cuddle = 0.7

# Global rise rates 1.5x the default world: needs return sooner, so each
# 2,000-tick episode contains more decisions that matter. 1.5x (up from the
# original 1.25x) is the probe-searched winner — see F-004 and
# experiments/exp-001-bc-mappo/results/world-search-2026-07-27.md; 1.75x
# was measured and is WORSE (trajectory noise outruns signal).
[needs]
eat = 0.6
drink = 0.6
sleep = 0.42
play = 0.6
cuddle = 0.6
bath = 0.3

# Scarcer still than the first cut (was 5-7): the safeguard guarantees
# relief (Article I holds in training), but bowls and beams are contested —
# scarcity x tempo is the one combination whose cooperative-signal gain
# replicated across three disjoint world batches (F-004).
[elements.water]
min = 3
max = 4

[elements.chow]
min = 3
max = 4
servings = 5

[elements.bug]
min = 4
max = 8
ttl = 300

[elements.greeble]
min = 1
max = 3
ttl = 300

# Two beams, five cats: the yield-this-take-next behavior the observation's
# two sunbeam slots were sized for, now with real turn-taking pressure.
[elements.sunbeam]
min = 2
max = 2
ttl = 300

[rl.episode]
horizon = 2000

# Fog Gen 1 (spec 049): the vision disc -- see cloudkitty.toml's [vision]
# for the full note. ARC-TEMPORARY 40 (world-covering, the pre-fog world)
# until the arc's last config task flips it to the placeholder 5.
[vision]
radius = 40
memory_timeout_ticks = 0

[rl.reward]
p = 0.0          # Nash welfare — the product objective, unchanged
epsilon = 0.01
mode = "level"
