<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudKitty</title>
<style>
  :root {
    --cream: #fdf6ec;
    --cream-deep: #f5e8d8;
    --grass: #e7f2df;
    --grass-line: #d8e8cd;
    --ink: #6b5a4e;
    --ink-soft: #9c8a7c;
    --card: #fffdfa;
    --shadow: rgba(150, 125, 105, 0.18);
    --happy: #8fce8f;
    --okay: #f3cf7a;
    --meh: #efa98b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 40px;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Quicksand",
                 system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #fffaf2 0%, var(--cream) 60%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    min-height: 100vh;
  }

  header { text-align: center; }

  h1 {
    margin: 0;
    font-size: 1.9rem;
    letter-spacing: 0.4px;
    font-weight: 700;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .stage {
    background: var(--card);
    border-radius: 28px;
    padding: 16px;
    box-shadow: 0 12px 30px var(--shadow);
    line-height: 0;
  }

  canvas { border-radius: 18px; }

  .panel {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 940px;
  }

  .kitty-card {
    background: var(--card);
    border-radius: 18px;
    padding: 10px 14px;
    box-shadow: 0 6px 16px var(--shadow);
    /* Fixed width, sized for the longest lines a card can carry (the
       patience cue and a full meow quote), so text changes -- purring on
       and off, meows, activities -- never resize the portrait. `flex` with
       zero shrink matters as much as the width: four cards fill the panel
       row exactly, and shrinkable flex items would quietly compress by a
       few pixels whenever a scrollbar appears. */
    box-sizing: border-box;
    width: 226px;
    flex: 0 0 auto;
  }

  .kitty-card .name {
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .kitty-card .name canvas {
    border-radius: 6px;
    background: var(--grass);
  }

  /* One-line text rows: with the card width fixed, a rare over-long line
     trims to an ellipsis rather than ever stretching the card. */
  .kitty-card .mood,
  .kitty-card .doing,
  .kitty-card .patience {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kitty-card .mood {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin: 2px 0 0;
  }

  .kitty-card .doing {
    font-size: 0.75rem;
    color: var(--ink);
    margin: 1px 0 6px;
    min-height: 1em;
  }

  /* The gentle long-distress cue: soft, caring, never an alarm. Empty (and
     therefore invisible) whenever nothing has been wanted for too long --
     but always one line tall, so its coming and going never changes the
     card's height (which would ripple into page scrollbar toggles and
     subtle card wobble). */
  .kitty-card .patience {
    font-size: 0.72rem;
    font-style: italic;
    color: #b0876a;
    margin: 0 0 4px;
    min-height: 1em;
  }

  .bar {
    height: 8px;
    border-radius: 99px;
    background: var(--cream-deep);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease, background-color 0.4s ease;
  }

  .needs {
    margin-top: 8px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 8px;
    font-size: 0.68rem;
    color: var(--ink-soft);
    align-items: center;
  }

  .needs .bar { height: 5px; }

  footer {
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-align: center;
  }

  kbd {
    background: var(--cream-deep);
    border-radius: 6px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 0.75rem;
  }

  #status.disconnected { color: var(--meh); font-weight: 700; }
  #debug-note { color: var(--meh); font-weight: 700; }
  [hidden] { display: none !important; }

  /* Reduced motion (spec 005 FR-015): the panel's bar transitions join the
     canvas in going still. Toggled on <body> from the media query. */
  body.reduced-motion .bar > span { transition: none; }

  /* Small screens: the renderer fits the map to the viewport (render.js),
     and the single file of fixed-width cards becomes a 2-up grid so every
     kitty is readable at once. Grid columns are stable fractions of the
     viewport, so the fixed-width rationale above survives: text changes
     still cannot resize a card -- every text row already ellipsizes, and
     `min-width: 0` is what lets it (a grid item's default min-width is
     its content, which would defeat the ellipsis and stretch the track). */
  @media (max-width: 600px) {
    body { padding: 16px 10px 28px; }
    .stage { padding: 10px; border-radius: 20px; }
    canvas { border-radius: 12px; }
    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
    }
    .kitty-card {
      width: auto;
      min-width: 0;
      padding: 8px 10px;
    }
    /* Keyboard hints mean nothing to a touch screen. */
    .keys { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>☁️ CloudKitty 🐾</h1>
    <p class="subtitle">a small, safe world where kitties frolic and play</p>
  </header>

  <div class="stage">
    <canvas id="world" width="720" height="720"></canvas>
  </div>

  <section class="panel" id="panel"></section>

  <footer>
    <span id="status">connecting…</span> ·
    tick <span id="tick">0</span><span class="keys"> ·
    press <kbd>g</kbd> to reveal greebles · <kbd>l</kbd> for grid lines ·
    <kbd>p</kbd> for worn paths</span>
    <span id="debug-note" hidden>· 👻 greebles visible</span>
    <span id="grid-note" hidden>· ⌗ grid lines visible</span>
    <span id="paths-note" hidden>· 🐾 worn paths visible</span>
  </footer>

  <script src="cat.js"></script>
  <script src="props.js"></script>
  <script src="meadow.js"></script>
  <script src="render.js"></script>
  <script src="anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
