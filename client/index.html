<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CloudKitty</title>
<!-- The PNGs are rendered from favicon.svg (the touch icon from a
     full-bleed variant, since iOS masks its own rounded corners). iPhone
     Safari ignores SVG favicons, so it takes the PNG fallbacks instead. -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Self-hosted faces: the rounded look the old font stack could only wish
     for on Apple devices now reaches everyone. Variable-weight woff2, latin
     subset, OFL-licensed (fonts/OFL-*.txt). Nunito is the body voice;
     Baloo 2 appears only in the wordmark. */
  @font-face {
    font-family: "Nunito";
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
    src: url("fonts/nunito-latin.woff2") format("woff2");
  }

  @font-face {
    font-family: "Baloo 2";
    font-style: normal;
    font-weight: 400 800;
    font-display: swap;
    src: url("fonts/baloo2-latin.woff2") format("woff2");
  }

  :root {
    --cream: #fdf6ec;
    --cream-deep: #f5e8d8;
    --zenith: #fffaf2; /* the bright top of the sky gradient */
    --grass: #e7f2df;
    --grass-line: #d8e8cd;
    --ink: #6b5a4e;
    --ink-soft: #9c8a7c;
    --patience-ink: #b0876a; /* the gentle long-distress cue */
    --card: #fffdfa;
    --shadow: rgba(150, 125, 105, 0.18);
    --happy: #8fce8f;
    --okay: #f3cf7a;
    --meh: #efa98b;
  }

  /* Golden hour (the canvas world switches with it -- see setTheme in
     app.js). One twilight set serving both dawn and dusk: still a light
     page, so the ink family stays daytime; the grounds take an apricot
     wash and shadows warm. */
  body.dusk {
    --cream: #f4dcc8;
    --cream-deep: #e8c9ae;
    --zenith: #ffe8c4;
    --grass: #dfe3bd;
    --grass-line: #cdd6ad;
    --card: #fdf3e6;
    --shadow: rgba(150, 100, 80, 0.22);
  }

  /* The page after sundown (the canvas world switches with it -- see
     setTheme in app.js). Not a dark mode: the same warm world, moonlit.
     Plum-indigo dusk instead of black, cards as lantern-lit surfaces,
     and the happy/okay/meh pastels unchanged -- they read on both
     grounds, and a kitty's mood should not change color at night. */
  body.night {
    --cream: #2b2733;
    --cream-deep: #3f3849;
    --zenith: #3b3450;
    --grass: #364237;
    --grass-line: #2c3a2e;
    --ink: #ece3d4;
    --ink-soft: #b3a798;
    --patience-ink: #cfa287;
    --card: #37313f;
    --shadow: rgba(12, 8, 20, 0.5);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 40px;
    font-family: "Nunito", ui-rounded, "SF Pro Rounded",
                 system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--zenith) 0%, var(--cream) 60%);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    min-height: 100vh;
  }

  header { text-align: center; }

  /* The wordmark: the one place the display face appears, with the world's
     own art loafing at each end. The canvases ride the text baseline -- the
     cat's ground line sits at 88% of its box (cat.js), so the -4px shift
     (0.12 * 32px) puts their feet exactly on the baseline. */
  h1 {
    margin: 0;
    font-family: "Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif;
    font-size: 2rem;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  h1 canvas {
    vertical-align: -4px;
    margin: 0 4px;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .stage {
    background: var(--card);
    border-radius: 28px;
    padding: 16px;
    box-shadow: 0 12px 30px var(--shadow);
    line-height: 0;
    position: relative; /* anchors the sky dial to the map's corner */
  }

  /* The sky dial perches on the map's top edge (owner call, 2026-07-23):
     the dial canvas's bottom edge IS the horizon, pinned to the world
     canvas's top border by anchoring from the stage's BOTTOM (100% minus
     the stage padding) -- height-independent, so it holds at any size.
     Width is a fraction of the stage, so the dial scales with the
     displayed map (owner fix, 2026-07-23: fixed pixels loomed huge on
     mobile and under desktop window resizing); at the full 720px map it
     comes out at the tuned ~78px. Height follows the canvas's intrinsic
     2:1 ratio. */
  #sky-dial {
    position: absolute;
    bottom: calc(100% - 16px);
    right: 5%;
    width: 10.5%;
    pointer-events: none;
    /* Opt out of the global canvas rounding: 18px radius on a canvas
       this small clips the dome's lower corners clean off. */
    border-radius: 0;
  }

  canvas { border-radius: 18px; }

  .panel {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    max-width: 940px;
  }

  .kitty-card {
    background: var(--card);
    border-radius: 18px;
    padding: 10px 14px;
    box-shadow: 0 6px 16px var(--shadow);
    /* Fixed width, sized for the longest lines a card can carry (the
       patience cue and a full meow quote), so text changes -- purring on
       and off, meows, activities -- never resize the portrait. `flex` with
       zero shrink matters as much as the width: four cards fill the panel
       row exactly, and shrinkable flex items would quietly compress by a
       few pixels whenever a scrollbar appears. */
    box-sizing: border-box;
    width: 226px;
    flex: 0 0 auto;
  }

  .kitty-card .name {
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .kitty-card .name canvas {
    border-radius: 6px;
    background: var(--grass);
  }

  /* One-line text rows: with the card width fixed, a rare over-long line
     trims to an ellipsis rather than ever stretching the card. */
  .kitty-card .mood,
  .kitty-card .doing,
  .kitty-card .patience {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .kitty-card .mood {
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin: 2px 0 2px;
  }

  .kitty-card .doing {
    font-size: 0.75rem;
    color: var(--ink);
    margin: 1px 0 2px;
    min-height: 1em;
  }

  /* The gentle long-distress cue: soft, caring, never an alarm. Empty (and
     therefore invisible) whenever nothing has been wanted for too long --
     but always one line tall, so its coming and going never changes the
     card's height (which would ripple into page scrollbar toggles and
     subtle card wobble). The -2px bottom margin tucks the "needs" heading
     slightly into this line's leading: constant, so no height wobble, and
     small enough that ~2px of air remains when the cue text is showing. */
  .kitty-card .patience {
    font-size: 0.72rem;
    font-style: italic;
    color: var(--patience-ink);
    margin: 0 0 -2px;
    min-height: 1em;
  }

  /* The "needs" heading. No top margin: the reserved patience line above
     already provides the section's air. */
  .kitty-card .section-label {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 2px;
  }

  .bar {
    height: 8px;
    border-radius: 99px;
    background: var(--cream-deep);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease, background-color 0.4s ease;
  }

  .needs {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 3px 8px;
    font-size: 0.68rem;
    color: var(--ink-soft);
    align-items: center;
  }

  .needs .bar { height: 5px; }

  footer {
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-align: center;
  }

  kbd {
    background: var(--cream-deep);
    border-radius: 6px;
    padding: 1px 6px;
    font-family: inherit;
    font-size: 0.75rem;
  }

  /* The theme control: label, toggle button, and the setting's name in
     words. One unbreakable unit so footer wrapping never splits it. */
  .theme-control { white-space: nowrap; }

  #theme-toggle {
    background: var(--cream-deep);
    border: none;
    border-radius: 99px;
    padding: 2px 9px;
    font: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    line-height: 1.3;
  }

  #theme-toggle:focus-visible {
    outline: 2px solid var(--ink-soft);
    outline-offset: 2px;
  }

  /* The tick counter's digits change every second; tabular figures keep the
     footer from jittering as they do. */
  #tick { font-variant-numeric: tabular-nums; }

  #status.disconnected { color: var(--meh); font-weight: 700; }
  #debug-note { color: var(--meh); font-weight: 700; }
  [hidden] { display: none !important; }

  /* Reduced motion (spec 005 FR-015): the panel's bar transitions join the
     canvas in going still. Toggled on <body> from the media query. */
  body.reduced-motion .bar > span { transition: none; }

  /* Small screens: the renderer fits the map to the viewport (render.js),
     and the single file of fixed-width cards becomes a 2-up grid so every
     kitty is readable at once. Grid columns are stable fractions of the
     viewport, so the fixed-width rationale above survives: text changes
     still cannot resize a card -- every text row already ellipsizes, and
     `min-width: 0` is what lets it (a grid item's default min-width is
     its content, which would defeat the ellipsis and stretch the track). */
  @media (max-width: 600px) {
    body { padding: 16px 10px 28px; }
    .stage { padding: 10px; border-radius: 20px; }
    /* Thinner stage padding moves the map's top edge; the horizon follows. */
    #sky-dial { bottom: calc(100% - 10px); }
    canvas { border-radius: 12px; }
    .panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
    }
    .kitty-card {
      width: auto;
      min-width: 0;
      padding: 8px 10px;
    }
    /* Keyboard hints mean nothing to a touch screen. */
    .keys { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1><canvas class="header-kitty" data-facing="right" width="32" height="32" aria-hidden="true"></canvas>CloudKitty<canvas class="header-kitty" data-facing="left" width="32" height="32" aria-hidden="true"></canvas></h1>
    <p class="subtitle">a small, safe world where kitties frolic and play</p>
  </header>

  <div class="stage">
    <canvas id="world" width="720" height="720"></canvas>
    <canvas id="sky-dial" width="78" height="39" aria-hidden="true"></canvas>
  </div>

  <section class="panel" id="panel"></section>

  <footer>
    <span id="status">connecting…</span> ·
    tick <span id="tick">0</span><span class="keys"> ·
    press <kbd>g</kbd> to reveal greebles · <kbd>l</kbd> for grid lines ·
    <kbd>p</kbd> for worn paths</span>
    <span id="debug-note" hidden>· 👻 greebles visible</span>
    <span id="grid-note" hidden>· ⌗ grid lines visible</span>
    <span id="paths-note" hidden>· 🐾 worn paths visible</span>
    · <span class="theme-control">set theme
      <button id="theme-toggle" aria-label="switch to Always Day">🌤️</button>
      <span id="theme-name">Day/Night Cycle</span></span>
  </footer>

  <script src="cat.js"></script>
  <script src="props.js"></script>
  <script src="meadow.js"></script>
  <script src="render.js"></script>
  <script src="anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
