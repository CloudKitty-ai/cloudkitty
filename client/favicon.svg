<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The CloudKitty favicon: Biscuit loafing on the meadow, drawn in the v2
       cat art the world itself draws (first cut owner-gated 2026-07-22;
       redrawn against cat-v2.js and re-gated 2026-09-19).

       Every cat coordinate below is the shipped `loaf` layout, taken off a
       recording of drawCat rather than traced by eye, mirrored to face left
       and mapped into this 64 unit box by
           x = (1 - u) * 53.5506 + 5.1176,  y = v * 53.5506 + 6.0239.
       So is the draw order: tail, body, belly, back stripes, ears, inner
       ears, head, forehead stripes, lids, nose, mouth. The eyes are closed
       because the POSE closes them (catLayout sets `L.eyes = 'closed'` for
       the loaf); nothing here overrides the face. The colors are Biscuit's
       own PALETTES entry: fur #e3bd8b, shade #b9905f, tabby #c89a63, belly =
       fur lightened 0.35 toward white, eye ink #453c36, nose = noseColor
       darkened 2 percent.

       The tail is wrapped along the front of the loaf, which is where the
       pose puts it, so the body covers all but the near end. That is
       faithful, not a dropped path.

       Three deliberate departures, all of them about 16px:

       1. The outline inks at #9d7a51, not the #b9905f the canvas uses. That
          is furShade times 0.85, which is cat-v2's own far-leg shade: the
          one place the art already needs an edge against fur its own color.
          It buys 25.1 L* off the fur where furShade buys 16.2, and the icon
          is read at sizes the canvas never draws.
       2. The outline is 2.6 units. OUTLINE_W maps to 1.87 at this scale,
          which is 0.47 of a pixel in a 16px tab, and under a pixel is where
          an outline stops arriving at all.
       3. No whiskers. cat-v2 fades them out below 0.8 real pixels; they
          land at 0.4px in the 32px favicon, so they would be a smudge
          exactly where the face needs to stay clean.

       The meadow keeps the saturated #8fce8f of the first cut rather than
       the real grass (#e9f3e1). Pale grass sits 2.9 L* off this cream card
       and simply vanishes; #8fce8f sits 19.9 off it and is what gives the
       icon a color at tab size. The horizon at 44 puts the line at her
       belly. Bedding her deeper was tried and rejected (owner, 2026-09-19):
       at 41 the line crosses her middle and she reads as sinking. -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#fdf6ec"/>
  <path d="M1 44 L63 44 L63 49 Q63 63 49 63 L15 63 Q1 63 1 49 Z" fill="#8fce8f"/>

  <!-- zzz, drifting up and away from the head -->
  <g stroke="#9c8a7c" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M28 7.5 h6.5 l-6.5 6.5 h6.5" stroke-width="2.4"/>
    <path d="M37.5 3.5 h4.2 l-4.2 4.2 h4.2" stroke-width="1.9"/>
  </g>

  <defs>
    <clipPath id="b"><ellipse cx="34.03" cy="41.94" rx="20.03" ry="10.4"/></clipPath>
    <clipPath id="h"><circle cx="21.18" cy="31.77" r="11.25"/></clipPath>
    <clipPath id="ef"><path d="M22.39 20.64 L30.46 18.77 L29.89 24.74 Z"/></clipPath>
    <clipPath id="en"><path d="M12.47 24.74 L11.9 18.77 L19.97 20.64 Z"/></clipPath>
  </defs>

  <!-- The tail, wrapped along the front: a shade band with a fur core,
       which is how cat-v2 draws every tail. -->
  <path d="M50.1 46.23 C42.6 53.72 28.68 53.72 22.25 49.44" fill="none" stroke="#9d7a51" stroke-width="4.55" stroke-linecap="round"/>
  <path d="M50.1 46.23 C42.6 53.72 28.68 53.72 22.25 49.44" fill="none" stroke="#e3bd8b" stroke-width="1.55" stroke-linecap="round"/>

  <!-- The loaf, its belly and its back stripes. Both markings are clipped to
       the body exactly as the canvas clips them. -->
  <ellipse cx="34.03" cy="41.94" rx="20.03" ry="10.4" fill="#e3bd8b"/>
  <ellipse cx="31.43" cy="47.66" rx="12.42" ry="4.37" fill="#edd4b4" opacity="0.85" clip-path="url(#b)"/>
  <ellipse cx="34.03" cy="41.94" rx="20.03" ry="10.4" fill="none" stroke="#9d7a51" stroke-width="2.6"/>
  <g fill="#c89a63" clip-path="url(#b)">
    <ellipse cx="43.05" cy="36.22" rx="1.5" ry="6.45" transform="rotate(6.45 43.05 36.22)"/>
    <ellipse cx="34.03" cy="36.22" rx="1.5" ry="6.45"/>
    <ellipse cx="25.02" cy="36.22" rx="1.5" ry="6.45" transform="rotate(-6.45 25.02 36.22)"/>
  </g>

  <!-- Ears upright, far one first, each with its pink clipped to its own
       outline. Drawn before the head so their bases are covered by it. -->
  <path d="M22.39 20.64 L30.46 18.77 L29.89 24.74 Z" fill="#e3bd8b" stroke="#9d7a51" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M12.47 24.74 L11.9 18.77 L19.97 20.64 Z" fill="#e3bd8b" stroke="#9d7a51" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M23.97 21.5 L29.11 20.31 L28.75 24.11 Z" fill="#c58a79" clip-path="url(#ef)"/>
  <path d="M13.61 24.11 L13.25 20.31 L18.39 21.5 Z" fill="#c58a79" clip-path="url(#en)"/>

  <!-- The head, its forehead stripes, and the sleeping face -->
  <circle cx="21.18" cy="31.77" r="11.25" fill="#e3bd8b" stroke="#9d7a51" stroke-width="2.6"/>
  <g stroke="#c89a63" stroke-width="1.5" stroke-linecap="round" fill="none" clip-path="url(#h)">
    <path d="M24.11 21.42 L24.33 26.71"/>
    <path d="M20.96 21.42 L21.18 26.71"/>
    <path d="M17.81 21.42 L18.03 26.71"/>
  </g>
  <g stroke="#453c36" stroke-width="1.69" stroke-linecap="round" fill="none">
    <path d="M20.01 31.58 A2.14 2.14 0 0 0 23.03 31.58"/>
    <path d="M14.39 31.58 A2.14 2.14 0 0 0 17.41 31.58"/>
  </g>
  <path d="M20.62 33.88 L16.8 33.88 L18.71 36.37 Z" fill="#c58a79"/>
  <path d="M18.71 36.37 A1.35 0.9 0 0 0 21.41 36.37 M16.01 36.37 A1.35 0.9 0 0 0 18.71 36.37" fill="none" stroke="#9d7a51" stroke-width="1.03" stroke-linecap="round"/>
</svg>
