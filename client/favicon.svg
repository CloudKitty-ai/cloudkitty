<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The CloudKitty favicon: a biscuit-tabby loaf napping on the meadow
       (owner-gated 2026-07-22, four revision rounds). Palette matches the
       viewer's Biscuit colorway (client/cat.js PALETTES) and the meadow
       greens. Drawn for 16px legibility: bold shapes, one dark outline. -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#fdf6ec"/>
  <path d="M1 44 L63 44 L63 49 Q63 63 49 63 L15 63 Q1 63 1 49 Z" fill="#8fce8f"/>
  <!-- zzz -->
  <path d="M44 10 h7 l-7 7 h7" stroke="#9c8a7c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M54 20 h4.5 l-4.5 4.5 h4.5" stroke="#9c8a7c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- ears first: base corners tucked well inside the loaf, so the body
       outline drawn over them stays continuous and nothing gaps -->
  <path d="M16 33 L14 12 L24 28 Z" fill="#e3bd8b" stroke="#5b4636" stroke-width="3" stroke-linejoin="round"/>
  <path d="M27 28 L30.5 12.5 L37 27 Z" fill="#e3bd8b" stroke="#5b4636" stroke-width="3" stroke-linejoin="round"/>
  <path d="M15.6 26.5 L14.6 15 L21 24.5 Z" fill="#c98d7b"/>
  <path d="M28.6 24 L30.6 15 L34.8 24 Z" fill="#c98d7b"/>
  <!-- the loaf -->
  <path d="M12 52 V40 Q12 26 26 26 L42 26 Q54 26 54 39 V52 Z" fill="#e3bd8b" stroke="#5b4636" stroke-width="3" stroke-linejoin="round"/>
  <!-- tabby stripes on the back -->
  <path d="M43 28 q1.1 3.4 0.3 6.4 M48 30 q1 3.2 0.3 6 M51.5 33.5 q0.8 2.8 0.3 5.4" stroke="#b9905f" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- tucked tail: fur shade inside a dark outline. The dark outline only
       begins where the tail leaves the body, and the fur core starts inside
       it and paints over the body's own outline on the way out, so the
       root has no border and the tail reads as an extension of the loaf. -->
  <path d="M54.2 48.9 Q54.8 52 48.5 53 Q43.5 53.8 41 51.5" stroke="#5b4636" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M52.5 46 Q57.5 51.5 48.5 53 Q43.5 53.8 41 51.5" stroke="#b9905f" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- sleeping eyes -->
  <path d="M17 38 Q20 41 23 38" stroke="#4a3a2e" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <path d="M27 38 Q30 41 33 38" stroke="#4a3a2e" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- nose -->
  <path d="M22.7 43.5 L27.3 43.5 L25 46 Z" fill="#c98d7b"/>
</svg>
