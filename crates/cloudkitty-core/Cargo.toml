[package]
name = "cloudkitty-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CloudKitty simulation engine: the law of the kitty world"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
# `time` powers the Article IV decision budget; `rt`/`macros` are test-only conveniences
# but must be declared here since features are additive across the workspace.
tokio = { workspace = true, features = ["time", "rt", "macros"] }

toml = "0.8"
[dev-dependencies]
proptest = "1"
# Spec 039's golden evolution digest pins a sha256 of world state; same
# version the rl crate already carries.
sha2 = "0.10"
tokio = { workspace = true, features = ["time", "rt", "rt-multi-thread", "macros", "test-util"] }
# Core itself is format-agnostic; tests parse TOML to prove the config schema
# round-trips the way cloudkitty.toml is written.

[target.'cfg(unix)'.dependencies]
# Process-group kill for script plugins (spec 053 FR-012): killpg is the
# one call std does not wrap.
libc = "0.2"
