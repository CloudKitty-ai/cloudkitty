[package]
name = "clowder"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CloudKitty viewer load benchmark: how many watchers, and how does it fail (spec 029)"

[[bin]]
name = "clowder"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
futures = { workspace = true }
# The WS client half of the pairing the server's contract tests already use.
tokio-tungstenite = "0.21"
sha2 = "0.10"
# RLIMIT_NOFILE (research R6); already in the tree transitively.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
