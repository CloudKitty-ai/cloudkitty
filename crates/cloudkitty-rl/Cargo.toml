[package]
name = "cloudkitty-rl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CloudKitty RL surface: encodings, reward, episodes, evaluation, policy behavior"

[[bin]]
name = "kitty-eval"
path = "src/bin/kitty-eval.rs"

[dependencies]
cloudkitty-core = { path = "../cloudkitty-core" }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
proptest = "1"
tokio = { workspace = true, features = ["rt", "macros"] }
