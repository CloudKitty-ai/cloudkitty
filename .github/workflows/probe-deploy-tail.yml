name: probe-deploy-tail
on: pull_request
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: probe
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/m1.py" <<'PYEOF'
          # M1: the original print, cat "$body" (line 200 only).
          p = "docs/deploy/update.sh"; L = open(p).read().split("\n")
          old = """    if ! printf '%s\\n' "$text"; then"""
          assert L[199] == old, L[199]
          L[199] = """    if ! cat "$body"; then"""
          open(p, "w").write("\n".join(L))
          PYEOF
          cat > "$RUNNER_TEMP/m2.py" <<'PYEOF'
          # M2: the section print's failure is swallowed (line 200 only).
          p = "docs/deploy/update.sh"; L = open(p).read().split("\n")
          old = """    if ! printf '%s\\n' "$text"; then"""
          assert L[199] == old, L[199]
          L[199] = """    if ! { printf '%s\\n' "$text" || true; }; then"""
          open(p, "w").write("\n".join(L))
          PYEOF

          set +e
          T="bash docs/deploy/test-update-tail.sh"
          cyc() { echo "#### $1"; scripts/mutate.sh --expect "$2" docs/deploy/update.sh "python3 $RUNNER_TEMP/$3" "$T" 2>&1 | tail -4; echo "#### $1 mutate-exit=${PIPESTATUS[0]}"; }
          echo "#### baseline"; $T; echo "#### baseline exit=$?"
          cyc "M2 closed" 'FAIL closed stdout is not a clean deploy: exit 0' m2.py
          cyc "M2 full" 'FAIL full disk is not a clean deploy: exit 0' m2.py
          cyc "M1 closed" 'FAIL closed stdout is not a clean deploy: exit 0' m1.py
          for t in .claude/hooks/test-revert-guard.sh .claude/hooks/test-checkout-guard.sh scripts/test-mutate.sh; do
            out=$(bash "$t" 2>&1); rc=$?; echo "#### other $t exit=$rc"; [ $rc -ne 0 ] && echo "$out" | tail -15
          done
          exit 0
