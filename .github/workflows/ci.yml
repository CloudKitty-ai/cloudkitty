name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The constitution (Article VI) requires the property-based invariant suite to be a
  # required gate on every merge. `cargo test --workspace` includes it.
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (includes the Articles I-III invariant suite)
        run: cargo test --workspace

  # Spec 014 T003: the Python surface is a required gate — SC-002's two-process
  # reproducibility test lives here. Only the optional PettingZoo conformance
  # step may fail without failing the merge.
  python:
    name: python surface (maturin + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install build and test tooling
        run: pip install maturin pytest numpy

      - name: Build and install the extension module
        run: maturin develop --release
        working-directory: crates/cloudkitty-py

      - name: pytest (smoke + SC-002 two-process reproducibility)
        run: pytest crates/cloudkitty-py/tests -v

      # Pinned, and no longer continue-on-error (2026-07-24): the unpinned
      # optional step failed silently for months when pettingzoo 1.26
      # changed its harness. The pin means only OUR regressions can fail
      # this step; a pettingzoo upgrade is a deliberate bump of this line,
      # with whatever harness changes it brings faced consciously.
      - name: PettingZoo conformance
        run: |
          pip install "pettingzoo==1.26.1"
          pytest crates/cloudkitty-py/tests/test_pettingzoo_conformance.py -v
