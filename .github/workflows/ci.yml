name: CI

on:
  push:
    branches: [main]
  # No branch filter on pull_request: a stacked PR (base = another feature
  # branch) previously got ZERO checks — and even retargeting to main fires
  # only `edited`, which doesn't trigger workflows — so #107 sat green-less
  # until a close/reopen. Every PR gates now, whatever its base.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The constitution (Article VI) requires the property-based invariant suite to be a
  # required gate on every merge. `cargo test --workspace` includes it.
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `rustup toolchain install` here: rust-toolchain.toml pins the
      # compiler, and rustup installs it -- with the components the file
      # names -- the first time anything invokes a shim. Reinstalling
      # `stable` alongside it only downloads a second toolchain nobody uses.
      # This step is the gate that the pin was honoured: a `cargo` that is
      # not a rustup shim ignores the file silently, which is the one way
      # this could land inert.
      - name: Verify the pinned toolchain
        run: |
          pinned=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          resolved=$(rustc -V)
          echo "pinned:   $pinned"
          echo "resolved: $resolved"
          case "$resolved" in
            "rustc $pinned "*) ;;
            *) echo "::error::resolved toolchain does not match rust-toolchain.toml (want $pinned)"; exit 1 ;;
          esac

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (includes the Articles I-III invariant suite)
        run: cargo test --workspace

      # Spec 052: every guard in the tree runs here, not only the Rust ones.
      # The four build their fixtures under `mktemp -d` and need only bash,
      # git, curl, jq and python3 (all on ubuntu-latest).
      - name: Shell tests (deploy tail, hook self-tests, mutate runner)
        run: |
          bash docs/deploy/test-update-tail.sh
          bash .claude/hooks/test-revert-guard.sh
          bash .claude/hooks/test-checkout-guard.sh
          bash scripts/test-mutate.sh

  # Spec 014 T003: the Python surface is a required gate — SC-002's two-process
  # reproducibility test lives here. Only the optional PettingZoo conformance
  # step may fail without failing the merge.
  python:
    name: python surface (maturin + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `rustup toolchain install` here: rust-toolchain.toml pins the
      # compiler, and rustup installs it -- with the components the file
      # names -- the first time anything invokes a shim. Reinstalling
      # `stable` alongside it only downloads a second toolchain nobody uses.
      # This step is the gate that the pin was honoured: a `cargo` that is
      # not a rustup shim ignores the file silently, which is the one way
      # this could land inert.
      - name: Verify the pinned toolchain
        run: |
          pinned=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          resolved=$(rustc -V)
          echo "pinned:   $pinned"
          echo "resolved: $resolved"
          case "$resolved" in
            "rustc $pinned "*) ;;
            *) echo "::error::resolved toolchain does not match rust-toolchain.toml (want $pinned)"; exit 1 ;;
          esac

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: |
          python -m venv .venv
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install build and test tooling
        run: pip install maturin pytest numpy

      - name: Build and install the extension module
        run: maturin develop --release
        working-directory: crates/cloudkitty-py

      - name: pytest (smoke + SC-002 two-process reproducibility)
        run: pytest crates/cloudkitty-py/tests -v

      # Pinned, and no longer continue-on-error (2026-07-24): the unpinned
      # optional step failed silently for months when pettingzoo 1.26
      # changed its harness. The pin means only OUR regressions can fail
      # this step; a pettingzoo upgrade is a deliberate bump of this line,
      # with whatever harness changes it brings faced consciously.
      - name: PettingZoo conformance
        run: |
          pip install "pettingzoo==1.26.1"
          pytest crates/cloudkitty-py/tests/test_pettingzoo_conformance.py -v

  # Duplication ratchet (jscpd survey 2026-09-27, .claude/reports/;
  # owner accepted 2026-09-27). Thresholds sit just above the values
  # measured at 8592583 and only ever move DOWN: when a PR genuinely
  # reduces duplication, re-measure and lower the number in that PR.
  # Never widen a threshold to pass — a mid-refactor PR that must
  # temporarily duplicate fences the block instead:
  #     // jscpd:ignore-start -- <reason>, out by <target>
  #     ...
  #     // jscpd:ignore-end
  # Fences are debt with a deadline: tag-check fails a release while
  # any jscpd:ignore marker remains in the tree (Harness's rule).
  # jscpd is pinned to the survey's version; bumping it means
  # re-measuring the baselines in the same PR.
  duplication:
    name: duplication ratchet (jscpd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: rust prod (measured 3.20)
        run: npx --yes jscpd@5.3.2 crates/ --pattern "**/*.rs" --ignore "**/tests/**" --threshold 3.5 --silent

      - name: rust tests (measured 5.90; shipped_configs core-rl pair is deliberate)
        run: npx --yes jscpd@5.3.2 crates/cloudkitty-core/tests crates/cloudkitty-rl/tests crates/cloudkitty-server/tests --pattern "**/*.rs" --threshold 6.5 --silent

      - name: client prod js (measured 2.71; rigs excluded like the ship list)
        run: npx --yes jscpd@5.3.2 client/ --pattern "**/*.{js,mjs}" --ignore "**/test-motion.mjs,**/test-meadow.mjs" --threshold 3.0 --silent
