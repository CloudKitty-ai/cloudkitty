name: harness (meta checks)

# The Harness thread's meta checks (THREADS.md §1). The growth budget on
# the files every session loads: net lines since the last condense pass,
# tiers and numbers in .claude/CONDENSE-LOG.md, logic in
# scripts/condense-budget.sh. A pull request is gated (tier 1 and a
# frozen file block; tier 2 blocks past its second line); a push to main
# reports only, so Experiments' direct commits show their count.
#
# tag-check's SELF-TEST also runs here on every PR; the full tag-check
# suite runs only in tag-rigor.yml (tags + dispatch), because it compares
# the whole tree against its documentation homes and unrelated PRs would
# inherit every open drift.
#
# The budget job reads git only. The tag-check and chebyshev-guard
# self-tests build throwaway fixture repos (tag-check's with its own
# Cargo.toml/pyproject.toml) in temp dirs OUTSIDE this checkout, so
# the shipped-config sweep's rule about tomls under experiments/
# still does not apply.
#
# chebyshev-guard also sweeps the real tree here: undeclared
# `max(abs(` / `Math.max(Math.abs(` in lab/client code (walk distance
# is Manhattan; allowlist scripts/chebyshev-allow.txt). A PR is gated;
# a push to main reports only — most hits live under experiments/ and
# Experiments commits to main directly, so for them this is a tripwire
# in the log, not a gate.

on:
  push:
    branches: [main]
  # No branch filter, for the reason ci.yml gives: a stacked PR must
  # still get its checks.
  pull_request:

jobs:
  budget:
    name: condense budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base SHA on the log's last pass line has to be reachable.
          fetch-depth: 0
      - name: Self-test the budget script
        run: bash scripts/test-condense-budget.sh
      - name: Growth since the last condense pass
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash scripts/condense-budget.sh --gate
          else
            bash scripts/condense-budget.sh --report
          fi

  tag-check-selftest:
    name: tag-check self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the tag-check suite
        run: bash scripts/test-tag-check.sh

  chebyshev-guard:
    name: chebyshev guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the guard
        run: bash scripts/test-chebyshev-guard.sh
      - name: Undeclared Chebyshev sweep
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash scripts/chebyshev-guard.sh --gate
          else
            bash scripts/chebyshev-guard.sh --report
          fi

  # Incident 6 (PR #429): a squash onto a moved origin/main carried a
  # 941-line reversal of another thread's files through green CI. The
  # branch prefix claims the lane (scripts/lanes.txt, from THREADS §1);
  # a path outside it fails by name. 'cross-lane: <reason>' in the PR
  # body downgrades to report. PR-only: a push to main has no lane.
  lane-check:
    name: lane check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Self-test the lane check
        run: bash scripts/test-lane-check.sh
      - name: PR paths stay in the branch's lane
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/lane-check.sh "$HEAD_REF" "origin/$BASE_REF"
