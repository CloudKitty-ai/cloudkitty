name: harness (meta checks)

# The Harness thread's meta checks (THREADS.md §1). The growth budget on
# the files every session loads: net lines since the last condense pass,
# tiers and numbers in .claude/CONDENSE-LOG.md, logic in
# scripts/condense-budget.sh. A pull request is gated (tier 1 and a
# frozen file block; tier 2 blocks past its second line); a push to main
# reports only, so Experiments' direct commits show their count.
#
# tag-check's SELF-TEST also runs here on every PR; the full tag-check
# suite runs only in tag-rigor.yml (tags + dispatch), because it compares
# the whole tree against its documentation homes and unrelated PRs would
# inherit every open drift.
#
# Reads git only. It never loads a toml, so the shipped-config sweep's
# rule about tomls under experiments/ does not apply here.

on:
  push:
    branches: [main]
  # No branch filter, for the reason ci.yml gives: a stacked PR must
  # still get its checks.
  pull_request:

jobs:
  budget:
    name: condense budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base SHA on the log's last pass line has to be reachable.
          fetch-depth: 0
      - name: Self-test the budget script
        run: bash scripts/test-condense-budget.sh
      - name: Growth since the last condense pass
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            bash scripts/condense-budget.sh --gate
          else
            bash scripts/condense-budget.sh --report
          fi

  tag-check-selftest:
    name: tag-check self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the tag-check suite
        run: bash scripts/test-tag-check.sh
