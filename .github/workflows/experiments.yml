name: experiments (non-blocking)

# Builds and tests the research tooling under experiments/tools, so engine
# API drift and broken tool behaviour get noticed. Deliberately not a
# required check: experiments/ is trainer territory (see
# experiments/README.md) and must never gate product changes. A build or
# test failure keeps the check green (continue-on-error on the step) but
# emits a warning annotation, so it is visible in the checks UI without
# opening the logs.

# The workflow's own file is in its paths so an edit to it runs it before
# merge, not first on main.
on:
  push:
    branches: [main]
    paths: ["experiments/**", "crates/**", ".github/workflows/experiments.yml"]
  pull_request:
    branches: [main]
    paths: ["experiments/**", "crates/**", ".github/workflows/experiments.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tools:
    name: build + test experiments/tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # No `rustup toolchain install`: rust-toolchain.toml at the repo root
      # pins the compiler for these crates too -- rustup walks up from the
      # working directory, so the separate workspaces under experiments/tools
      # resolve to the same toolchain the engine is built with. The pin is
      # gated in ci.yml; this workflow is non-blocking by doctrine and does
      # not add a check that could fail it.

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/tools/twin-probe

      # Every Rust crate under experiments/tools, not just twin-probe:
      # spec 028's analyze pass found bc-collect and artifact-tools had
      # drifted invisibly because they were never in this loop. Still
      # non-blocking by doctrine (see the header comment); the warning
      # names exactly which crates drifted.
      - name: Build tools crates
        id: build
        continue-on-error: true
        run: |
          failed=""
          for m in experiments/tools/*/Cargo.toml; do
            crate=$(basename "$(dirname "$m")")
            echo "::group::build $crate"
            if ! cargo build --manifest-path "$m"; then
              failed="$failed $crate"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Surface engine drift
        if: steps.build.outcome == 'failure'
        run: echo "::warning title=Engine drift::experiments/tools crates no longer build against crates/ —${{ steps.build.outputs.failed }} — non-blocking, see the build log in this run"

      # The crates' own tests (owner's word 2026-10-27, on Product's report
      # that nothing ran them: each crate is its own workspace, so ci.yml's
      # `cargo test --workspace` never reaches them). Warn only, the same
      # doctrine as the build ("Fix both. Warn only."). A crate whose build
      # failed above is skipped: its drift is already named, and cargo test
      # would only fail it a second time. The timeout stops a hung test from
      # holding the runner to GitHub's 6-hour default; a step stopped early
      # never writes its crate list, so the warning says so instead.
      - name: Test tools crates
        id: test
        continue-on-error: true
        timeout-minutes: 30
        env:
          BUILD_FAILED: ${{ steps.build.outputs.failed }}
        run: |
          failed=""
          for m in experiments/tools/*/Cargo.toml; do
            crate=$(basename "$(dirname "$m")")
            case " $BUILD_FAILED " in *" $crate "*) continue ;; esac
            echo "::group::test $crate"
            if ! cargo test --manifest-path "$m"; then
              failed="$failed $crate"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "failed=$failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Surface tools test failures
        if: steps.test.outcome == 'failure'
        run: echo "::warning title=Tools tests failed::experiments/tools crates fail their own tests —${{ steps.test.outputs.failed || ' (none named; the step stopped early, e.g. timed out)' }} — non-blocking, see the test log in this run"
