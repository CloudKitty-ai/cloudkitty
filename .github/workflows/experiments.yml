name: experiments (non-blocking)

# Builds the research tooling under experiments/tools so engine API drift
# gets noticed. Deliberately not a required check: experiments/ is trainer
# territory (see experiments/README.md) and must never gate product changes.
# A build failure keeps the check green (continue-on-error on the step) but
# emits a warning annotation, so drift is visible in the checks UI without
# opening the logs.

on:
  push:
    branches: [main]
    paths: ["experiments/**", "crates/**"]
  pull_request:
    branches: [main]
    paths: ["experiments/**", "crates/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tools:
    name: build experiments/tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/tools/twin-probe

      - name: Build twin-probe
        id: build
        continue-on-error: true
        run: cargo build --manifest-path experiments/tools/twin-probe/Cargo.toml

      - name: Surface engine drift
        if: steps.build.outcome == 'failure'
        run: echo "::warning title=Engine drift::experiments/tools no longer builds against crates/ — non-blocking, see the build log in this run"
