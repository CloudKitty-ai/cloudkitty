[workspace]
resolver = "2"
members = [
    "crates/cloudkitty-core",
    "crates/cloudkitty-server",
    "crates/cloudkitty-rl",
    "crates/cloudkitty-py",
    "crates/clowder",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# "rc" lets us serialize the Arc<WorldSnapshot> the sim task publishes without
# cloning the whole world for every reader.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
async-trait = "0.1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
futures = "0.3"
tokio = "1"
