# policies/registry.toml — the model registry (spec 034).
#
# One row per certified artifact, keyed by sha256 — the same identity the
# README ledgers and the server logs at startup. The `display` line is what
# viewers read on a kitty's card, served verbatim; `architecture` is always
# spelled out ("Transformer", "MLP" — never internal shorthand).
#
# Rules (spec 034 FR-003, enforced by tests/registry_integrity.rs and by
# startup refusal):
#   - A row is born in the same PR that lands its .ckpolicy at top level —
#     Experiments authors it at certification time.
#   - Rows never change and never leave: sha is identity, so renames and
#     retirement don't touch this file.
#   - Seating an artifact whose sha has no row refuses startup.
#
# Values that are NOT rows (documentation only, spec 034 FR-002):
#   - "Scripted" is fixed in code for built-in behaviors; no registry row.
#   - Phase-1 lineage seats are expected to arrive as "Transformer" — the
#     row appears when the artifact does.
#
# Display style (owner ruling 2026-08-16, superseding the launch format):
# the display line is the architecture alone, spelled out for a general
# audience ("Transformer", "Multi-Layer Perceptron") — training recipe
# stays in the `recipe` field as provenance but is not served. Display
# amendments on the owner's word are the one sanctioned row change;
# sha and architecture/recipe provenance stay immutable.

