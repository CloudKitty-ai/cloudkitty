[package]
name = "distress-census"
version = "0.1.0"
edition = "2021"
publish = false
description = "Retro-replay of kitty-eval runs with a distress-tick counter: per-run x kitty x need ticks at/above the distress threshold, on the exact eval code path (exp-004 gate work)."

[dependencies]
cloudkitty-core = { path = "../../../crates/cloudkitty-core" }
cloudkitty-rl = { path = "../../../crates/cloudkitty-rl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone on purpose: not a member of the product workspace (see
# experiments/README.md — product CI never builds research code).
[workspace]
