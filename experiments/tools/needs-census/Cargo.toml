[package]
name = "needs-census"
version = "0.1.0"
edition = "2021"
publish = false
description = "Need-occupancy census by replay: per kitty x need histograms, dwell dynamics and activity-initiation conditioning, for the meow announce-threshold decision (exp-004)."

[dependencies]
cloudkitty-core = { path = "../../../crates/cloudkitty-core" }
cloudkitty-rl = { path = "../../../crates/cloudkitty-rl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Standalone on purpose: not a member of the product workspace (see
# experiments/README.md — product CI never builds research code).
[workspace]
