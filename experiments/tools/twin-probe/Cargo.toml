[package]
name = "twin-probe"
version = "0.1.0"
edition = "2021"
publish = false
description = "Counterfactual twin probe: measures CloudKitty's credit horizon by diffing reward trajectories of substitution twins (exp-001 prereg §6)."

[dependencies]
cloudkitty-core = { path = "../../../crates/cloudkitty-core" }
cloudkitty-rl = { path = "../../../crates/cloudkitty-rl" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Standalone on purpose: not a member of the product workspace (see
# experiments/README.md — product CI never builds research code).
[workspace]
