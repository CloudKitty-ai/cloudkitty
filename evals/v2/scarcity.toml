# evals/v2/scarcity.toml — the scarcity exam (spec 017, FR-005).
# FROZEN at landing: eval-suite-v2. Do not edit; see evals/v2/manifest.toml.
# Cut from the eval-suite-v1 exam of the same name as a COMPLETE 3.0 config
# (spec 049 FR-033): the design values are unchanged; every section the v1
# file left to the compiled defaults is now stated (FR-030), plus the fog
# keys. v1 stays the 2.x record.
#
# Does yielding survive genuine contention? The default world's geometry
# and roster with every element minimum at the validation floor (greebles
# 0, all else 1) and maxima at floor+1: one puddle, one bowl, one sunbeam,
# four cats. The safeguard spawner still answers every need above its
# threshold - working harder for relief is lawful; going without is not.
# NOTE: the default world's welfare bounds are calibrated to the default
# world's abundance. Scores here mean nothing against those bounds and are
# never judged by them (FR-003) - the paired needs_driven baseline is this
# exam's yardstick.

[world]
width = 32
height = 32
tick_ms = 800
seed = 1

# The bar's roster (positions and Pumpkin's snacky trait included), so
# contention is the ONLY axis this exam moves.
[[kitty]]
id = 1
name = "Miso"
x = 10
y = 12
behavior = "needs_driven"

[[kitty]]
id = 2
name = "Biscuit"
x = 20
y = 18
behavior = "needs_driven"

[[kitty]]
id = 3
name = "Pumpkin"
x = 16
y = 8
behavior = "needs_driven"
[kitty.needs]
eat = 0.8

[[kitty]]
id = 4
name = "Kittybear"
x = 5
y = 5
behavior = "needs_driven"

[needs]
eat = 0.4
drink = 0.4
sleep = 0.3
play = 0.4
cuddle = 0.4
bath = 0.2

# The floor. hard_min is 1 (greebles 0); maxima at floor+1 keep the
# population lean instead of drifting back toward abundance.
[elements.water]
min = 1
max = 2

[elements.chow]
min = 1
max = 2
servings = 5

[elements.bug]
min = 1
max = 2
ttl = 300

[elements.greeble]
min = 0
max = 1
ttl = 300

[elements.sunbeam]
min = 1
max = 2
ttl = 300

[persistence]
snapshot_path = "snapshot.json"
save_every_ticks = 100

[happiness]
